main: com.v4nden.bows.Bows
name: Bows
api-version: "1.21"
version: 1.0
depend: [packetevents]
commands:
  boost:
    description: "Get a boost"
    permission: "bows.root"
  startgame:
    description: "Start game"
    usage: "/startgame [test] [размер команды] [ники одной команды...]"
    permission: "bows.root"
  stopgame:
    description: "Stop game"
    permission: "bows.root"
  dummy:
    description: "Spawn test dummies (test game only)"
    usage: "/dummy [count|clear]"
    permission: "bows.root"
  hudtext:
    description: "Show animated HUD text above the crosshair (test)"
    usage: "/hudtext <seconds> <text...> (@nick = player head)"
    permission: "bows.root"
  info:
    description: "Boost descriptions menu"
    usage: "/info"
  worldsettings:
    description: "World settings for new games"
    usage: "/worldsettings"
    permission: "bows.root"
